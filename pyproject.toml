[project]
name = "mywhoosh-mcp"
version = "0.1.0"
description = "Minimal MCP server for MyWhoosh custom workouts (create + list)"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[project.scripts]
mywhoosh-mcp = "mywhoosh_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mywhoosh_mcp"]
